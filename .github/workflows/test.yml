name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # No API keys and no database — the suite covers the deterministic
      # parts only: taxonomy scoring, org/market classification, fetch
      # parsing, and the shape of the committed dashboard.
      - run: pytest tests/ -v
